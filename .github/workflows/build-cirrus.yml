name: Build Cirrus Headscale Image

on:
  push:
    branches:
      - cirrus-v0.24.2-suggest-exit-node

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/headscale

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cirrus-v0.24.2
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cirrus-v0.24.2-suggest-exit-node
          cache-from: type=gha
          cache-to: type=gha,mode=max
